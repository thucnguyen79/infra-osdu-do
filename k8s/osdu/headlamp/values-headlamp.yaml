# =============================================
# Headlamp - Kubernetes Dashboard
# =============================================

replicaCount: 1

clusterRoleBinding:
  create: true

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false  # Create separately with CF cert

# Node placement
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["workernode02"]
