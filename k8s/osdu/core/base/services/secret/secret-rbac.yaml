apiVersion: v1
kind: ServiceAccount
metadata:
  name: osdu-secret
  labels:
    app: osdu-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osdu-secret-k8s-secrets
  labels:
    app: osdu-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osdu-secret-k8s-secrets
  labels:
    app: osdu-secret
subjects:
  - kind: ServiceAccount
    name: osdu-secret
roleRef:
  kind: Role
  name: osdu-secret-k8s-secrets
  apiGroup: rbac.authorization.k8s.io
