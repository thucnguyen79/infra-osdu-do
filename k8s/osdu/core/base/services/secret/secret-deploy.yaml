apiVersion: apps/v1
kind: Deployment
metadata:
  name: osdu-secret
  labels:
    app: osdu-secret
    app.kubernetes.io/name: secret
    app.kubernetes.io/part-of: osdu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osdu-secret
  template:
    metadata:
      labels:
        app: osdu-secret
        app.kubernetes.io/name: secret
        app.kubernetes.io/part-of: osdu
    spec:
      serviceAccountName: osdu-secret
      containers:
        - name: secret
          image: community.opengroup.org:5555/osdu/platform/security-and-compliance/secret/core-plus-secret-release:28061ab0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: actuator
          envFrom:
            - configMapRef:
                name: osdu-core-env
          env:
            - name: OPENID_PROVIDER_URL
              value: "http://keycloak.osdu-identity.svc.cluster.local/realms/osdu"
            - name: OPENID_PROVIDER_CLIENT_ID
              value: "osdu-service"
            - name: OPENID_PROVIDER_CLIENT_SECRET
              value: "osdu-service-secret"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak.osdu-identity.svc.cluster.local/realms/osdu"
            - name: PARTITION_API
              value: "http://osdu-partition:8080/api/partition/v1"
            - name: ENTITLEMENTS_API
              value: "http://osdu-entitlements:8080/api/entitlements/v2"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "CHANGE_ME_STRONG"
            - name: DOMAIN
              value: "osdu.local"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
