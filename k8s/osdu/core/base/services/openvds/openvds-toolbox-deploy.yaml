apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvds-toolbox
  labels:
    app: openvds-toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openvds-toolbox
  template:
    metadata:
      labels:
        app: openvds-toolbox
    spec:
      containers:
        - name: openvds
          image: community.opengroup.org:5555/osdu/platform/domain-data-mgmt-services/seismic/open-vds/openvds-ingestion:3.4.9
          command: ["sleep", "infinity"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openvds-s3-secret
                  key: ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openvds-s3-secret
                  key: SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: S3_ENDPOINT
              value: "http://rook-ceph-rgw-osdu-store.rook-ceph.svc:80"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 10Gi
