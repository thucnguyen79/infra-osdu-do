# patch-entitlements-all.yaml
# Hợp nhất tất cả cấu hình cho Entitlements Core Plus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osdu-entitlements
spec:
  template:
    spec:
      containers:
        - name: entitlements
          env:
            # === PARTITION API ===
            - name: PARTITION_API
              value: "http://osdu-partition:8080/api/partition/v1"
            
            # === KEYCLOAK/JWT ===
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: osdu-core-env
                  key: KEYCLOAK_ISSUER_URI
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "$(KEYCLOAK_ISSUER_URI)"
            
            # === REDIS CACHING ===
            - name: REDIS_USER_INFO_HOST
              valueFrom:
                configMapKeyRef:
                  name: osdu-core-env
                  key: REDIS_HOST
            - name: REDIS_USER_INFO_PORT
              valueFrom:
                configMapKeyRef:
                  name: osdu-core-env
                  key: REDIS_PORT
            - name: REDIS_USER_GROUPS_HOST
              valueFrom:
                configMapKeyRef:
                  name: osdu-core-env
                  key: REDIS_HOST
            - name: REDIS_USER_GROUPS_PORT
              valueFrom:
                configMapKeyRef:
                  name: osdu-core-env
                  key: REDIS_PORT
            
            # === DATABASE (bổ sung cho Core Plus) ===
            - name: ENTITLEMENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osdu-postgres-secret
                  key: POSTGRES_PASSWORD

            # === OPENID PROVIDER (token provisioning for Partition API) ===
            # Copied from Storage service (working). Required for
            # PartitionTenantInfoFactoryConfig to set "token provider configured: true"
            - name: OPENID_PROVIDER_URL
              value: "http://keycloak.osdu-identity.svc.cluster.local/realms/osdu"
            - name: OPENID_PROVIDER_ISSUER
              value: "http://keycloak.osdu-identity.svc.cluster.local/realms/osdu"
            - name: OPENID_PROVIDER_ISSUER_URI
              value: "http://keycloak.osdu-identity.svc.cluster.local/realms/osdu"
            - name: OPENID_PROVIDER_CLIENT_ID
              value: "osdu"
            - name: OPENID_PROVIDER_CLIENT_SECRET
              value: "dummy-secret-value"
            - name: OPENID_PROVIDER_SCOPES
              value: "openid profile email"

            # === PARTITION & AUTHORIZE ENDPOINTS ===
            - name: PARTITION_SERVICE_ENDPOINT
              value: "http://osdu-partition:8080"
            - name: PARTITION_HOST
              value: "http://osdu-partition:8080"
            - name: AUTHORIZE_API
              value: "http://osdu-entitlements:8080/api/entitlements/v2"

            # === CLOUD PROVIDER ===
            # === DOMAIN (app.domain for email validation) ===
            - name: APP_PROJECTID
              value: "osdu-poc"
            - name: GROUP_ID
              value: "osdu.local"
            - name: LOGGING_LEVEL_ORG_OPENGROUP_OSDU
              value: "DEBUG"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC
              value: "DEBUG"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: CLOUD_PROVIDER
              value: "minio"
